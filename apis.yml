x-personal-data:
  facet: This API returns records about identifiable natural persons — US sex-offender registry entries,
    name-matched and scored.
  reviewed: '2026-08-18'
  disposition: retained-with-annotation
  basis: Retained under the people-facet rule rather than suppressed. Every operation is authenticated
    (X-API-Key) and billed — an unkeyed call returns 402 — against public registry data the provider aggregates
    as its stated business. That is categorically different from an unadvertised unauthenticated endpoint
    leaking PII the operator does not know is open, which is the case the suppression rule exists for.
    No agent skill or MCP tool here grants access that a paid account does not already grant.
  checks_run:
  - Scanned every generated artifact for real-person literals — names, DOB, street addresses, SSN-shaped
    strings. None found.
  - The only name literals in this repo (Smith, Tony Wilson) are the PROVIDER's own documentation examples,
    carried verbatim in openapi/_original/. No live API response was used as an example.
  constraints_carried:
  - Not a consumer reporting agency — results must not be the sole basis for an FCRA-governed decision.
  - Some jurisdictions restrict commercial use — check legal.commercialUse on GET /v1/sources.
  - A zero from a jurisdiction that did not finish means UNKNOWN, not NO MATCH. Never report "no record
    found" while counts.sourcesIncomplete > 0.
