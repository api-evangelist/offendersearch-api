aid: offendersearch-api
name: Offendersearch API
description: 'Offendersearch, Inc. operates a REST API that unifies US sex-offender registry data — all
  50 states, the District of Columbia, the US territories and NSOPW, 58 registries in all — behind a single
  authenticated endpoint. One call searches every jurisdiction and returns scored, de-duplicated records
  in one normalized 76-field schema, each carrying per-source provenance, a deep link back to the originating
  registry, and its own lastCheckedAt timestamp. Its defining contract is completeness labelling: an incomplete
  search is reported as partial with per-source status and a closed incompleteReason enum rather than
  returned as a silently empty result, so a zero from a registry that did not finish reads as UNKNOWN
  rather than NO MATCH. The API offers synchronous, asynchronous (with signed webhooks and Idempotency-Key
  retries) and 1,000-row batch/CSV modes, per-request freshness tiers, consolidated timestamped verification-report
  PDFs with a citation on every record, and a drop-in offenders.io compatibility endpoint. It publishes
  an OpenAPI 3.1 contract in JSON and YAML, an RFC 9727 api-catalog, an llms.txt, a markdown twin of every
  documentation page, and a documented (private-beta) MCP server. Pricing is purely metered at $0.15 per
  call, $0.11 above 2,000 a month. Offendersearch is expressly not a consumer reporting agency and its
  results are not a consumer report.'
