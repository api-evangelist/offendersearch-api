  Confidence is capped at medium for every row: the MCP endpoint does not resolve, so no
  tools/list introspection was possible and no tool inputSchema is published — the mapping is
  by name, description and billing semantics only. Where the mapping IS confirmed by the
  provider's own words (get_registry_coverage described as "the public catalog of every
  registry we cover, with its scope, legal status and health — no API key required", which is
  exactly GET /v1/sources) it is marked high.
