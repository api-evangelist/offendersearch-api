entries:
  - date: '2026-08-04'
    version: null
    breaking: true
    title: Every date is ISO-8601
    highlights:
      - >-
        Every date-shaped field in a record now returns ISO-8601 — dob, the four offense.*Date
        fields and the five stateData date fields. They previously passed the registry's own
        string through byte-for-byte, so one response could carry "2003-03-31", "10/11/1988",
        "11-29-1987" and "Aug. 10, 1987" in the same key; offense.offenseDate was ISO on only
        45.4% of its populated values, in seven distinct shapes.
      - >-
        A partial date stays partial — YYYY-MM or YYYY — and a companion datePrecision object
        on offense and stateData names the precision. A day is never invented.
      - >-
        Nothing is discarded: an unparseable value (a crime description in an offence-date
        cell, a registrationEnds of "Life") returns "" with precision "unparseable", and the
        registry's literal text is preserved in datesAsPublished beside it.
    removals:
      - counts.sourcesStale
      - counts.sourcesDegraded
      - counts.sourcesOmitted
      - counts.recordsFromStaleSources
      - freshnessDetail
      - sourceStatus[].freshnessSatisfied
      - sourceStatus[].degraded
      - sourceStatus[].omitted
      - sourceStatus[].ageSeconds
      - sourceStatus[].lastSuccessAt
    deprecations:
      - 'onStale — deprecated but still accepted, so an older request body keeps working.'
    migration: >-
      Gate on counts.sourcesIncomplete instead of any removed key — it asks whether your ANSWER
      is whole, which is the question those keys were being used to ask. If you wrote a lenient
      date parser or a per-state format table you can delete it; string comparisons against
      these values change once.
    source: openapi/offendersearch-api-openapi.yml#/info/description
