x-description: 'Non-destructive enhancements API Evangelist derived for the published Offendersearch OpenAPI
  3.1.0. It changes nothing the provider asserts: it adds a tag taxonomy (the spec declares no tags[]
  and tags no operation), operationIds for the twelve admin operations that ship without one, info.contact
  and info.termsOfService (both absent), and the Idempotency-Key header that the documentation defines
  but the contract omits. The original spec is never mutated — see openapi/_original/.'
