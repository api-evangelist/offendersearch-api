- target: $.paths./v1/searches.post
  description: Document the Idempotency-Key request header. It is documented on the website (docs/async-and-webhooks.md)
    but is absent from the contract, so a code generator produces a client that cannot send it.
  update:
    parameters:
    - name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: A unique client-generated token. A repeated key returns the ORIGINAL job rather than
        starting — or billing — a second search.
