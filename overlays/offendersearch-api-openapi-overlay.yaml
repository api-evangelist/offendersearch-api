- target: $.info
  description: Add machine-readable contact and terms to info — the spec ships neither, so a consumer
    cannot resolve an owner or a licence from the contract alone.
  update:
    contact:
      name: Offendersearch Support
      email: support@offendersearch.app
      url: https://offendersearch.app/about
    termsOfService: https://offendersearch.app/terms
- target: $
  description: Declare the tag set this overlay applies. The published spec has no tags[] and no operation
    is tagged, so every generator renders 36 operations as one flat list.
  update:
    tags:
    - name: Search
      description: Synchronous, asynchronous, batch and legacy-compatibility search across all 58 registries.
    - name: Records
      description: Fetch a single normalized record by recordId or uuid.
    - name: Reports
      description: Consolidated verification-report PDFs and per-registry proof documents.
    - name: Coverage
      description: Jurisdiction coverage catalog and live per-registry source health. Anonymous.
    - name: Support
      description: Send a message to the Offendersearch team.
    - name: Account
      description: Account, usage, team and billing — session-token surface.
    - name: Keys
      description: API key lifecycle — create, list, rotate, revoke.
    - name: Admin
      description: Internal ops surface behind the separate X-Admin-Key credential. Not part of the public
        API.
